        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Tablet APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: CADCraft-Tablet-Edition-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
